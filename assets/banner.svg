<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#050816"/>
<stop offset="1" stop-color="#0b1f3a"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00f5ff"/>
<stop offset="0.5" stop-color="#7a5cff"/>
<stop offset="1" stop-color="#ff3cac"/>
<animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-opacity="0.07"/>
</pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<clipPath id="reveal">
<rect x="0" y="0" width="0" height="300">
<animate attributeName="width" from="0" to="1000" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
</rect>
</clipPath>
<path id="t1" d="M0 60H180L220 100H420L450 70H640"/>
<path id="t2" d="M1000 240H800L760 200H600L570 230H380"/>
<path id="t3" d="M0 250H120L160 210H300"/>
<path id="t4" d="M1000 50H860L820 90H720"/>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<rect width="1000" height="300" rx="18" fill="url(#grid)"/>
<g fill="none" stroke="#00f5ff" stroke-opacity="0.25" stroke-width="2">
<use href="#t1"/>
<use href="#t2"/>
<use href="#t3"/>
<use href="#t4"/>
</g>
<g fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="30 400">
<use href="#t1"><animate attributeName="stroke-dashoffset" from="430" to="0" dur="3.5s" repeatCount="indefinite"/></use>
<use href="#t2"><animate attributeName="stroke-dashoffset" from="430" to="0" dur="4.2s" repeatCount="indefinite"/></use>
<use href="#t3"><animate attributeName="stroke-dashoffset" from="430" to="0" dur="3s" repeatCount="indefinite"/></use>
<use href="#t4"><animate attributeName="stroke-dashoffset" from="430" to="0" dur="3.8s" repeatCount="indefinite"/></use>
</g>
<g fill="#00f5ff" filter="url(#glow)">
<circle r="4"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
<circle r="4" fill="#ff3cac"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
<circle r="3" fill="#7a5cff"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
<circle r="3"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>
</g>
<g transform="translate(860 150)" filter="url(#glow)">
<circle r="62" fill="none" stroke="#00f5ff" stroke-width="14" stroke-dasharray="14 10.2" stroke-opacity="0.85">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
</circle>
<circle r="48" fill="none" stroke="#7a5cff" stroke-width="3"/>
<circle r="30" fill="none" stroke="#ff3cac" stroke-width="10" stroke-dasharray="9 7.1" stroke-opacity="0.9">
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
</circle>
<circle r="8" fill="#00f5ff">
<animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
<g transform="translate(130 255)" filter="url(#glow)" opacity="0.9">
<circle r="34" fill="none" stroke="#7a5cff" stroke-width="9" stroke-dasharray="8 5.9" stroke-opacity="0.8">
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
</circle>
<circle r="6" fill="#ff3cac"/>
</g>
<g clip-path="url(#reveal)">
<text x="60" y="150" font-family="Fira Code, Consolas, monospace" font-size="92" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="6">AKBAR</text>
<text x="64" y="200" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#9fb4d6" letter-spacing="2">Mechatronics · Robotics · Embedded · Vision</text>
</g>
<g font-family="Fira Code, Consolas, monospace" font-size="16" fill="#00f5ff">
<text x="64" y="236" opacity="0">
&gt; WRO World Finalist x2 · FTC Dubai Finalist
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.4;1" dur="1s" begin="1.8s" fill="freeze"/>
</text>
<rect x="64" y="246" width="10" height="3" fill="#00f5ff">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</g>
<rect x="0" y="0" width="6" height="300" fill="#00f5ff" opacity="0.35" filter="url(#glow)">
<animate attributeName="x" values="0;994;0" dur="7s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
